version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine bumps; other major versions still get their own.
      npm-minor-patch:
        update-types: [minor, patch]
      # These move together (eslint majors need a matching typescript-eslint).
      lint-toolchain:
        patterns: ["eslint", "typescript", "@typescript-eslint/*"]
        update-types: [major]
    ignore:
      # Tracks the Node.js that VS Code's extension host runs, not the CI Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Actions are pinned to major tags, so Dependabot only ever proposes
      # majors for them, often several at once. Group all updates.
      actions:
        patterns: ["*"]
